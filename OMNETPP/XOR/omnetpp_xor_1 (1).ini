[General]
network = TEMP_Case_2x10x2_xor_final
sim-time-limit = 35s
simtime-resolution = 0.1ms
#abstract-config = true (requires omnet 7)
description = "XOR classification - TEMP using Async TSN differential relu"

include omnetpp_input_1.ini
include omnetpp_w1_1.ini
include omnetpp_w11_1.ini
include omnetpp_w2_1.ini
 
#input source params
*.*inn[*].numApps = 4*10 #4*no of hidden nodes
*.*inn[*].app[*].typename = "UdpSourceApp"
*.*inn[*].app[*].source.packetLength = 1B
*.*inn[*].app[*].source.productionInterval = 35s

#hidden nodes params
*.hidd[*].numApps = 1
*.hidd[*].app[0].typename = "UdpSink_temp_multicast"
*.hidd[*].app[*].destPorts = "1001 1002 " 
*.hidd[*].app[*].destAddresses = " outt[0] outt[1] " 
*.*hidd[*].app[*].startTime = 2.6s
*.*hidd[*].app[*].out_nodes = 2
*.*hidd[*].app[*].tneg = 1
#output nodes params
*.outt[*].numApps = 1
*.outt[*].app[0].typename = "UdpSink_temp_multicast_out"
*.outt[*].app[*].destPorts = "1001"
*.outt[*].app[*].destAddresses = "actuator"
*.outt[0].app[*].pktname = "class0"
*.outt[1].app[*].pktname = "class1"


*.*outt[0].app[0].localPort = 1001
*.*outt[1].app[0].localPort = 1002
*.*outt[*].app[*].startTime = 10s
*.*outt[*].app[*].tneg = 1

#output classifer node
*.actuator.numApps = 1
*.actuator.app[0].typename = "UdpSink"
*.actuator.app[0].localPort = 1001

#ATS params
*.*.hasOutgoingStreams = true
*.*ATS*.hasEgressTrafficShaping = true
*.*ATS*.hasIngressTrafficFiltering = true
*.*ATS*.bridging.streamFilter.ingress.meter[*].typename = "EligibilityTimeMeter"
*.*ATS*.bridging.streamFilter.ingress.meter[*].committedInformationRate = 2.8Mbps
*.*ATS*.bridging.streamFilter.ingress.meter[*].committedBurstSize = 10kB

*.*ATS*.bridging.streamFilter.ingress.meter[0].maxResidenceTime = 0s
*.*ATS*.bridging.streamFilter.ingress.meter[1].maxResidenceTime = 0.15207s
*.*ATS*.bridging.streamFilter.ingress.meter[2].maxResidenceTime = 0.30415s
*.*ATS*.bridging.streamFilter.ingress.meter[3].maxResidenceTime = 0.45622s
*.*ATS*.bridging.streamFilter.ingress.meter[4].maxResidenceTime = 0.6083s
*.*ATS*.bridging.streamFilter.ingress.meter[5].maxResidenceTime = 0.76037s
*.*ATS*.bridging.streamFilter.ingress.meter[6].maxResidenceTime = 0.91245s
*.*ATS*.bridging.streamFilter.ingress.meter[7].maxResidenceTime = 1.0645s

*.*ATS*.bridging.streamFilter.ingress.filter[*].typename = "EligibilityTimeFilter"


## asynchronous traffic shaping
*.*ATS*.eth[*].macLayer.queue.numTrafficClasses = 8
*.*ATS*.eth[*].macLayer.queue.queue[*].typename = "EligibilityTimeQueue"
*.*ATS*.eth[*].macLayer.queue.transmissionSelectionAlgorithm[*].typename = "Ieee8021qAsynchronousShaper"

#Hidden layer (mp_ATS1)
*.CBS*.eth[*].macLayer.queue.classifier.typename = "ContentBasedClassifier"
*.CBS*.eth[*].macLayer.queue.classifier.packetFilters = ["*1", "*2"]
*.CBS*.hasEgressTrafficShaping = true
*.CBS*.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]
*.CBS*.eth[*].macLayer.queue.numTrafficClasses = 2
*.CBS*.eth[*].macLayer.queue.*[*].dropperClass = "inet::queueing::PacketAtCollectionEndDropper"
*.CBS*.eth[*].macLayer.queue.*[*].display-name = "R0000"
*.CBS*.eth[*].macLayer.queue.transmissionSelectionAlgorithm[*].typename = "Ieee8021qCreditBasedShaper"
*.CBS*.eth[*].macLayer.queue.transmissionSelectionAlgorithm[*].idleSlope = 1bps # Channel data rate

*.CBS1.eth[*].macLayer.queue.transmissionSelectionAlgorithm[*].transmitCreditLimit = 1e-4
*.CBS2.eth[*].macLayer.queue.transmissionSelectionAlgorithm[*].transmitCreditLimit = 1e-4
*.CBS1*.eth[*].macLayer.queue.*[*].packetCapacity= 1 
*.CBS2*.eth[*].macLayer.queue.*[*].packetCapacity= 1 


*.*ATS*.bridging.streamCoder.decoder.mapping = [
	{ pcp: 0,  stream: "R00" },
	{ pcp: 1,  stream: "R01" },
	{ pcp: 2,  stream: "R02" },
	{ pcp: 3,  stream: "R03" },
	{ pcp: 4,  stream: "R04" },
	{ pcp: 5,  stream: "R05" },
	{ pcp: 6,  stream: "R06" },
	{ pcp: 7,  stream: "R07" },
	]

*.*ATS*.bridging.streamCoder.encoder.mapping = [
	{ stream: "R00", pcp: 0 },
	{ stream: "R01", pcp: 1 },
	{ stream: "R02", pcp: 2 },
	{ stream: "R03", pcp: 3 },
	{ stream: "R04", pcp: 4 },
	{ stream: "R05", pcp: 5 },
	{ stream: "R06", pcp: 6 },
	{ stream: "R07", pcp: 7 },
	]

*.*ATS*.bridging.streamFilter.ingress.numStreams = 8

*.*ATS*.bridging.streamFilter.ingress.classifier.mapping = {
	"R00": 0,
	"R01": 1,
	"R02": 2,
	"R03": 3,
	"R04": 4,
	"R05": 5,
	"R06": 6,
	"R07": 7,
	}
